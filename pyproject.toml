[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npu-top"
version = "0.1.6"
description = "Local-only Ascend NPU fleet monitor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@7eed6cdb9935f2922b5b280e9d78ad8eb823f5ce"]
authors = [{ name = "vllm-ascend-workspace" }]

[project.scripts]
npu-top = "npu_top.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/npu-top"
Repository = "https://github.com/mindie-agent/npu-top"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["npu_top"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
