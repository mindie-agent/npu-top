[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npu-top"
version = "0.3.3"
description = "Local-only Ascend NPU fleet monitor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@171623584aa812677df907518dcb55b06493241b",
  "remote-dev @ git+https://github.com/mindie-agent/remote-dev@3556df571450dab481a25e0157167f1c3727dc6c",
]
authors = [{ name = "vllm-ascend-workspace" }]

[project.scripts]
npu-top = "npu_top.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/npu-top"
Repository = "https://github.com/mindie-agent/npu-top"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["npu_top"]

[tool.hatch.build.targets.sdist]
include = ["/npu_top", "/app", "/tests", "/benchmarks", "/docs", "/scripts", "/hatch_build.py", "/package.json", "/package-lock.json", "/index.html", "/tsconfig.json", "/vite.config.ts", "/eslint.config.mjs", "/README.md", "/README.en.md", "/AGENTS.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
addopts = "-m 'not live_npu'"
markers = [
    "unit: pure in-memory unit and contract tests",
    "integration: local HTTP/SQLite/process integration tests",
    "live_npu: real SSH tests against live Ascend A2/A3 nodes",
]

