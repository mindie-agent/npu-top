name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python3 -m pip install . "pytest>=8,<10"
      - name: Run backend unit tests against the installed package
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/empty-home
        run: |
          mkdir -p "$HOME"
          python3 -m pytest -q "${{ github.workspace }}/tests"

  frontend-build:
    name: frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  package:
    name: wheel with frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: uv build
      - name: Confirm frontend assets are in the wheel
        run: |
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -F 'npu_top/static/index.html'
      - name: Install the wheel and smoke the console script
        env:
          HOME: ${{ runner.temp }}/empty-home
        run: |
          mkdir -p "$HOME"
          cd "${{ runner.temp }}"
          uv venv .venv-wheel
          VIRTUAL_ENV="$PWD/.venv-wheel" uv pip install "${{ github.workspace }}"/dist/*.whl
          .venv-wheel/bin/python -c "import npu_top, pathlib; p=pathlib.Path(npu_top.__file__).resolve(); assert 'site-packages' in p.parts, p"
          .venv-wheel/bin/npu-top --help
          .venv-wheel/bin/python -c "from npu_top.static_files import require_static; print(require_static() / 'index.html')"
