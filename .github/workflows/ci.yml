name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python3 -m pip install . "pytest>=8,<10"
      - name: Report installed Git and SSH selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          from remote_dev.core.ssh_transport import _ssh_executable
          git = shutil.which("git")
          print("Git on PATH:", git, flush=True)
          print("Resolved Git:", Path(git).resolve() if git else None, flush=True)
          print("Selected SSH:", _ssh_executable(), flush=True)
          PY
      - name: Run backend unit tests against the installed package
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/empty-home
          USERPROFILE: ${{ runner.temp }}/empty-home
        run: |
          mkdir -p "$HOME"
          python3 -m pytest -q "${{ github.workspace }}/tests" -m "not live_npu"

  frontend-build:
    name: frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  package:
    name: wheel with frontend assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: uv build
      - name: Confirm frontend assets are in the wheel
        run: |
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -F 'npu_top/static/index.html'
      - name: Install the wheel and smoke the console script outside checkout
        env:
          HOME: ${{ runner.temp }}/empty-home
          MINDIE_DATA_HOME: ${{ runner.temp }}/empty-home/mindie-data
        run: |
          mkdir -p "$HOME" "${{ runner.temp }}/smoke-cwd"
          cd "${{ runner.temp }}/smoke-cwd"
          uv venv "${{ runner.temp }}/.venv-wheel"
          VIRTUAL_ENV="${{ runner.temp }}/.venv-wheel" uv pip install "${{ github.workspace }}"/dist/*.whl
          "${{ runner.temp }}/.venv-wheel/bin/python" -c "import npu_top, pathlib; from npu_top.settings import Settings; p=pathlib.Path(npu_top.__file__).resolve(); assert 'site-packages' in p.parts, p; s=Settings.load(); assert s.state_dir.name == 'npu-top'"
          "${{ runner.temp }}/.venv-wheel/bin/npu-top" --help
          "${{ runner.temp }}/.venv-wheel/bin/python" -c "from npu_top.static_files import require_static; print(require_static() / 'index.html')"
          test ! -e "${{ runner.temp }}/smoke-cwd/data"

  release-ready:
    name: release-ready
    needs: [backend-tests, frontend-build, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "required CI failed or was skipped"'
