name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@0a3c9fd81fb37a1b4a52807d35509daca777ebf2
    with:
      benchmark-ref: 0a3c9fd81fb37a1b4a52807d35509daca777ebf2
      version-files: |
        pyproject.toml
        package.json
        package-lock.json
      setup-command: |
        uv venv --python 3.13 && uv pip install -r pyproject.toml pytest
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
      node: true
      build-command: |
        npm ci --no-audit --no-fund
        npm run build
        uv build --out-dir "$RELEASE_ASSETS_DIR"
        unzip -l "$RELEASE_ASSETS_DIR"/*.whl | grep -F 'npu_top/static/index.html'
