name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@main
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
    with:
      release-notes-path: docs/releases/npu-top-0.3.1.md
      version-files: |
        pyproject.toml
        package.json
        package-lock.json
      setup-command: |
        uv venv --python 3.13 && uv pip install -r pyproject.toml pytest
      test-command: |
        .venv/bin/python -m pytest -q -m "not live_npu"
      node: true
      build-command: |
        npm ci --no-audit --no-fund
        npm run build
        uv build --out-dir "$RELEASE_ASSETS_DIR"
        unzip -l "$RELEASE_ASSETS_DIR"/*.whl | grep -F 'npu_top/static/index.html'
