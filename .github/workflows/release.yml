name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@1cc96070a82425b2a9303402bcc52c9265284277
    with:
      setup-command: uv venv --python 3.13 && uv pip install -r pyproject.toml pytest
      node: true
      build-command: |
        npm ci --no-audit --no-fund
        npm run build
        uv build --out-dir "$RELEASE_ASSETS_DIR"
        unzip -l "$RELEASE_ASSETS_DIR"/*.whl | grep -F 'npu_top/static/index.html'
